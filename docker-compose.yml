services:
  aegis:
    build: .
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      ADMIN_USER: ${ADMIN_USER:-admin}
      # The Python launcher requires either password or hash before binding.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      AEGIS_SESSION_IDLE_SECONDS: ${AEGIS_SESSION_IDLE_SECONDS:-1800}
      AEGIS_SESSION_MAX_SECONDS: ${AEGIS_SESSION_MAX_SECONDS:-43200}
      AEGIS_LOGIN_WINDOW_SECONDS: ${AEGIS_LOGIN_WINDOW_SECONDS:-300}
      AEGIS_LOGIN_ACCOUNT_LIMIT: ${AEGIS_LOGIN_ACCOUNT_LIMIT:-10}
      AEGIS_LOGIN_IP_LIMIT: ${AEGIS_LOGIN_IP_LIMIT:-20}
      AEGIS_LOGIN_GLOBAL_LIMIT: ${AEGIS_LOGIN_GLOBAL_LIMIT:-100}
      AEGIS_ALLOWED_HOSTS: ${AEGIS_ALLOWED_HOSTS:-}
      AEGIS_ROLE_MAP: ${AEGIS_ROLE_MAP:-}
      AEGIS_ADMIN_TOKEN: ${AEGIS_ADMIN_TOKEN:-}
      AEGIS_TRUST_PROXY_IDENTITY: ${AEGIS_TRUST_PROXY_IDENTITY:-false}
      AEGIS_TRUSTED_PROXY_IPS: ${AEGIS_TRUSTED_PROXY_IPS:-}
      AEGIS_REQUIRE_ADMIN_IDENTITY: ${AEGIS_REQUIRE_ADMIN_IDENTITY:-false}
      AEGIS_DATABASE_PATH: /app/data/aegis.sqlite
      AEGIS_EVALUATION_WORKER_ENABLED: ${AEGIS_EVALUATION_WORKER_ENABLED:-true}
      AEGIS_EVALUATION_WORKER_TOKEN: ${AEGIS_EVALUATION_WORKER_TOKEN:-}
      AEGIS_POLICY_MAX_VERSIONS: ${AEGIS_POLICY_MAX_VERSIONS:-100}
      AEGIS_MODEL_MAX_CONCURRENT: ${AEGIS_MODEL_MAX_CONCURRENT:-8}
      AEGIS_ALLOW_PRIVATE_UPSTREAM: ${AEGIS_ALLOW_PRIVATE_UPSTREAM:-false}
      VLLM_MAIN_API_KEY: ${VLLM_MAIN_API_KEY:-}
      VLLM_GUARD_API_KEY: ${VLLM_GUARD_API_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
    volumes:
      - aegis_data:/app/data
    restart: unless-stopped
volumes:
  aegis_data:
